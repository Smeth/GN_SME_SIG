[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-gend"
version = "0.2.0.dev1"
description = "S.G.I DPF — Système de Gestion de l'Information (PySide6 + MySQL)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "pyodbc>=5.0",
    "pymysql>=1.1,<2",
    "openpyxl>=3.1,<4",
    "python-docx>=1.0",
    "python-barcode[images]>=0.15",
    "Pillow>=12.1,<14",
]

[project.scripts]
sme-gend = "sme_gend.__main__:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=7.0", "pandas>=2.2,<4", "xlrd>=2,<3", "python-calamine>=0.4,<1"]
tools = ["pandas>=2.2,<4", "xlrd>=2,<3", "python-calamine>=0.4,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sme_gend = ["py.typed", "resources/icons/*", "resources/styles/*.qss"]
