[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-gend"
version = "0.1.0"
description = "Client SME — liste du personnel (Access) / PySide6"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "pyodbc>=5.0",
    "openpyxl>=3.1,<4",
]

[project.scripts]
sme-gend = "sme_gend.__main__:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sme_gend = ["py.typed", "resources/icons/*.svg", "resources/styles/*.qss"]
